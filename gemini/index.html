<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wa-Tor Simulation</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a252f">
  
  <style>
    /* Premium dark aesthetics and fullscreen container layout */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a252f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- Load Phaser version 4.1.0 Salusa from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"></script>
</head>
<body>
  <!-- Container where the Phaser canvas will be rendered -->
  <div id="game-container"></div>

  <!-- Bootstrapping main.js using ES modules -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
