<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="A Wa-Tor predator-prey simulation rendered with Phaser.">
    <meta name="theme-color" content="#0a2a4a">
    <title>Wa-Tor Simulation</title>

    <!--
      PWA assets. All URLs are relative so the app also works when served from
      a repository subpath (app-shell/static-hosting 5.1). The icon files are
      the ones already present in assets/ (app-shell/pwa-support 1.2).
    -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon-192.png">

    <style>
        /* The canvas fills the window; statistics, the world, the controls, and
           the history chart are all drawn inside Phaser, so no DOM controls are
           layered over the display (app-shell/static-hosting 4.3). */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a2a4a;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <!--
      Phaser 4.x from the sanctioned CDN, loaded as a classic script so it is
      available on the global scope before the ES2020 module entry point runs
      (app-shell/static-hosting 1.1). The app code below loads as a module
      (app-shell/static-hosting 1.2); there is no build step (1.3).
    -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
